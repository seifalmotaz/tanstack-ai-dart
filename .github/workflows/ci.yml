name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm:
    name: Dart ${{ matrix.sdk }} VM
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.6.2', stable]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart run tool/verify_platform_test_policy.dart
      - if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test tool example
      - run: dart analyze
      - run: dart test --platform vm --reporter json > .dart_tool/tests.jsonl
      - run: dart run tool/parity_audit.dart .dart_tool/tests.jsonl .dart_tool/parity.json

  analyzer-fixtures:
    name: Analyzer fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/verify_types.dart

  chrome:
    name: Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test --platform chrome
      - run: dart run tool/verify_browser.dart

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/docs.dart check
      - run: dart analyze example tool/docs.dart
      - run: dart test test/doc
